[package]
name = "bonehead"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
emojis = "0.9.0"
poise = "0.7.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", features = ["full"] }
tokio = { version = "1.53.1", features = ["full"] }
